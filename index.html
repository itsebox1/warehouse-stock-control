<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse Stock Control</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f9fc;
      color: #203247;
    }

    button {
      background: #244b72;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 16px;
      font-size: 17px;
      width: 100%;
      margin: 12px 0;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin-top: 16px;
    }

    #result {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div id="loginScreen" style="display:none;">
  <h2>Staff Sign In</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email address"
    autocomplete="username"
    style="width:100%;padding:12px;box-sizing:border-box;margin-bottom:12px;"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    autocomplete="current-password"
    style="width:100%;padding:12px;box-sizing:border-box;margin-bottom:12px;"
  >

  <button id="loginButton">Sign In</button>

  <p id="loginMessage"></p>
</div>
<div id="stockApp" style="display:none;">

  <h2>Warehouse Stock Control</h2>

  <p>Scan a product QR code:</p>

  <button id="scanButton" onclick="startScanner()">
    📷 Scan QR Code
  </button>

  <div id="reader"></div>

  <p id="result">Ready to scan.</p>
  <div id="productDetails"></div>
</div>
  <script>
    let scanner = null;

    async function startScanner() {
      const result = document.getElementById("result");
      const button = document.getElementById("scanButton");

      button.disabled = true;
      result.textContent = "Opening camera...";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 220, height: 220 }
          },
          async function(decodedText) {
            result.textContent = "Looking up product: " + decodedText;
            const apiUrl = "https://script.google.com/macros/s/AKfycbxSsV0MNM0CpXsAGTePC-94XuDNfGgjg1U3Jww7zN_dofWuqBSbSeZEtpVRdys7leDi/exec";

try{

const product = await new Promise((resolve, reject) => {
  const callbackName = "warehouseProductCallback";
  const script = document.createElement("script");

  const timeout = setTimeout(() => {
    cleanup();
    reject(new Error("Product lookup timed out"));
  }, 15000);

  function cleanup() {
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();
  }

  window[callbackName] = function (data) {
    console.log("PRODUCT CALLBACK RECEIVED:", data);
    cleanup();
    resolve(data);
  };
script.onerror = function () {

  cleanup();
  reject(new Error("Could not load product details"));
};

script.src =
  apiUrl +
  "?page=api&sku=" +
  encodeURIComponent(decodedText.trim()) +
  "&callback=" +
  callbackName;

document.body.appendChild(script);
});

const details = document.getElementById("productDetails");

if (product && product.sku) {
  details.innerHTML = `
    <div style="padding:20px; background:#f3f6fa; border-radius:12px; margin-top:15px; color:#222;">

      <h2 style="margin-top:0;">${product.name}</h2>

      <p><strong>SKU:</strong> ${product.sku}</p>

      <hr>

      <p><strong>QuickBooks Stock:</strong> ${product.qbStock}</p>

      <p><strong>Actual Quantity:</strong> ${product.actualQty}</p>
      <label for="actualQtyInput"><strong>New Actual Quantity:</strong></label>

<input
  type="number"
  id="actualQtyInput"
  min="0"
  step="1"
  value="${product.actualQty ?? ''}"
  style="width:100%;padding:12px;font-size:18px;margin-top:10px;box-sizing:border-box;"
>

<button
  id="saveCountButton"
  type="button"
  style="width:100%;padding:15px;margin-top:15px;background:#29496b;color:white;border:none;border-radius:8px;font-size:18px;"
>
  Save Count
</button>

<p id="saveMessage"></p>


      <p><strong>Difference:</strong> ${product.difference}</p>

      <p><strong>Last Counted:</strong> ${product.lastCounted || "Not counted yet"}</p>

    </div>
  `;
} else {
  details.textContent = "Product not found";
}



            if (scanner && scanner.isScanning) {
              await scanner.stop();
            }

            button.disabled = false;
 } catch (error) {
  result.textContent = "Lookup error: " + String(error.message || error);
}
 
          },
          function(errorMessage) {
            // Keep scanning until a QR code is found.
          }
        );

        result.textContent = "Point the camera at a QR code.";

      } catch (error) {
        result.textContent =
          "Scanner or product lookup error: " + String(error.message || error);

        button.disabled = false;
      }
    }
  </script>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
// TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyActCI1cDBEfnFM-ZNuvrp64w_fY-lkE94",
    authDomain: "warehouse-stock-control-70263.firebaseapp.com",
    projectId: "warehouse-stock-control-70263",
    storageBucket: "warehouse-stock-control-70263.firebasestorage.app",
    messagingSenderId: "720424252092",
    appId: "1:720424252092:web:d66599d1e37eb64659d6b9"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
    window.getCurrentStaffEmail = function() {
      return auth.currentUser
        ? auth.currentUser.email
        : null;
};
  
  onAuthStateChanged(auth, (user) => {
  document.getElementById("loginScreen").style.display = user ? "none" : "block";
  document.getElementById("stockApp").style.display = user ? "block" : "none";
});
 document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Signing in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "";
  } catch (error) {
    message.textContent = "Sign-in failed: " + error.message;
  }
}); 
</script>
</body>
</html>
