<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse Stock Control</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f9fc;
      color: #203247;
    }

    button {
      background: #244b72;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 16px;
      font-size: 17px;
      width: 100%;
      margin: 12px 0;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin-top: 16px;
    }

    #result {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div id="loginScreen" style="display:none;">
  <h2>Staff Sign In</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email address"
    autocomplete="username"
    style="width:100%;padding:12px;box-sizing:border-box;margin-bottom:12px;"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    autocomplete="current-password"
    style="width:100%;padding:12px;box-sizing:border-box;margin-bottom:12px;"
  >

  <button id="loginButton">Sign In</button>

  <p id="loginMessage"></p>
</div>
<div id="stockApp" style="display:none;">

  <h2>Warehouse Stock Control</h2>

  <p>Scan a product QR code:</p>

  <button id="scanButton" onclick="startScanner()">
    📷 Scan QR Code
  </button>

  <p>Or enter a SKU manually:</p>

<input
  type="text"
  id="manualSku"
  placeholder="Enter product SKU"
  style="width:100%; padding:14px; box-sizing:border-box; font-size:17px;"
>

<button id="findSkuButton" onclick="findManualSku()">
  Find Product
</button>

  <div id="reader"></div>

  <p id="result">Ready to scan.</p>
  <div id="productDetails"></div>
</div>
<script>
let scanner = null;
let lookupInProgress = false;

const apiUrl =
  "https://script.google.com/macros/s/AKfycbxSsV0MNM0CpXsAGTePC-94XuDNfGgjg1U3Jww7zN_dofWuqBSbSeZEtpVRdys7leDi/exec";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

async function lookupProduct(sku) {
  const result = document.getElementById("result");
  const details = document.getElementById("productDetails");

  sku = String(sku).trim();

  if (!sku) {
    result.textContent = "Please enter a product SKU.";
    return;
  }

  if (lookupInProgress) return;

  lookupInProgress = true;
  details.textContent = "";
  result.textContent = "Looking up product: " + sku;

  try {
    const product = await new Promise((resolve, reject) => {
      const callbackName = "warehouseProductCallback";
      const script = document.createElement("script");

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("Product lookup timed out"));
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = function(data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function() {
        cleanup();
        reject(new Error("Could not load product details"));
      };

      script.src =
        apiUrl +
        "?page=api&sku=" +
        encodeURIComponent(sku) +
        "&callback=" +
        callbackName;

      document.body.appendChild(script);
    });

    if (product && product.sku) {
      details.innerHTML = `
        <div style="padding:20px;background:#f3f6fa;border-radius:12px;margin-top:15px;color:#222;">

          <h2>${escapeHtml(product.name)}</h2>

          <p><strong>SKU:</strong> ${escapeHtml(product.sku)}</p>

          <hr>

          <p><strong>QuickBooks Stock:</strong>
            ${escapeHtml(product.qbStock)}</p>

          <p><strong>Actual Quantity:</strong>
            ${escapeHtml(product.actualQty)}</p>

          <label for="actualQtyInput">
            <strong>New Actual Quantity:</strong>
          </label>

          <input
            type="number"
            id="actualQtyInput"
            min="0"
            step="1"
            style="width:100%;padding:12px;font-size:18px;margin-top:10px;box-sizing:border-box;"
          >

          <button
            id="saveCountButton"
            type="button"
            style="width:100%;padding:15px;margin-top:15px;background:#29496b;color:white;border:none;border-radius:8px;font-size:18px;"
          >
            Save Count
          </button>

          <p id="saveMessage"></p>

          <p><strong>Difference:</strong>
            ${escapeHtml(product.difference)}</p>

          <p><strong>Last Counted:</strong>
            ${escapeHtml(product.lastCounted || "Not counted yet")}</p>

        </div>
      `;

      document.getElementById("actualQtyInput").value =
        product.actualQty ?? "";

      result.textContent = "Product found: " + product.sku;

      document.getElementById("saveCountButton").onclick = () => saveProductCount(product);

    } else {
      details.textContent = "Product not found";
      result.textContent = "No matching product for SKU: " + sku;
    }

  } catch (error) {
    result.textContent =
      "Lookup error: " + String(error.message || error);

  } finally {
    lookupInProgress = false;
  }
}

async function startScanner() {
  const result = document.getElementById("result");
  const button = document.getElementById("scanButton");

  button.disabled = true;
  result.textContent = "Opening camera...";

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 220, height: 220 }
      },

      async function(decodedText) {
        if (lookupInProgress) return;

        try {
          if (scanner && scanner.isScanning) {
            await scanner.stop();
          }

          await lookupProduct(decodedText);

        } catch (error) {
          result.textContent =
            "Scanner error: " + String(error.message || error);

        } finally {
          button.disabled = false;
        }
      },

      function(errorMessage) {
        // Continue scanning until a QR code is found.
      }
    );

    if (scanner && scanner.isScanning) {
      result.textContent = "Point the camera at a QR code.";
    }

  } catch (error) {
    result.textContent =
      "Scanner error: " + String(error.message || error);

    button.disabled = false;
  }
}

function findManualSku() {
  const sku =
    document.getElementById("manualSku").value.trim();

  if (!sku) {
    document.getElementById("result").textContent =
      "Please enter a product SKU.";
    return;
  }

  lookupProduct(sku);
}
 async function saveProductCount(product) {
  const input = document.getElementById("actualQtyInput");
  const button = document.getElementById("saveCountButton");
  const message = document.getElementById("saveMessage");

  const quantity = input.value.trim();

  if (
    quantity === "" ||
    !Number.isSafeInteger(Number(quantity)) ||
    Number(quantity) < 0
  ) {
    message.textContent = "Please enter a valid whole-number quantity.";
    return;
  }

  button.disabled = true;
  message.textContent = "Saving count...";

  try {
    const idToken = await window.getCurrentStaffToken();

    await fetch(apiUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        action: "saveCount",
        sku: product.sku,
        quantity: Number(quantity),
        idToken: idToken
      })
    });

    message.textContent =
      "Save request sent. Checking the updated stock...";

    await new Promise(resolve => setTimeout(resolve, 2000));

    await lookupProduct(product.sku);

  } catch (error) {
    message.textContent =
      "Save request could not be sent: " +
      String(error.message || error);

  } finally {
    button.disabled = false;
  }
}
 
</script>
  
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
// TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyActCI1cDBEfnFM-ZNuvrp64w_fY-lkE94",
    authDomain: "warehouse-stock-control-70263.firebaseapp.com",
    projectId: "warehouse-stock-control-70263",
    storageBucket: "warehouse-stock-control-70263.firebasestorage.app",
    messagingSenderId: "720424252092",
    appId: "1:720424252092:web:d66599d1e37eb64659d6b9"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
    window.getCurrentStaffEmail = function() {
      return auth.currentUser
        ? auth.currentUser.email
        : null;
};
window.getCurrentStaffToken = async function() {
  if (!auth.currentUser) {
    throw new Error("Please sign in first.");
  }

  return await auth.currentUser.getIdToken();
};
  
  
  onAuthStateChanged(auth, (user) => {
  document.getElementById("loginScreen").style.display = user ? "none" : "block";
  document.getElementById("stockApp").style.display = user ? "block" : "none";
});
 document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Signing in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "";
  } catch (error) {
    message.textContent = "Sign-in failed: " + error.message;
  }
}); 


</script>
</body>
</html>
